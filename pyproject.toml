[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-toolkit"
version = "0.1.0"
description = "Peer-group anomaly detection: leave-one-out scoring, tuned Random Forest, SHAP explainability."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "shap",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["anomaly_toolkit*"]
